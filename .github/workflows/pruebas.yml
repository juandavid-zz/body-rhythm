# Corre las pruebas del backend y revisa el frontend en cada PR y en cada push a main.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

# Si llega un push nuevo al mismo PR, se cancela la ejecución anterior
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Misma base de datos que XAMPP (MariaDB 10.4)
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: ci_root
          MARIADB_DATABASE: body_rhythm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_NAME: body_rhythm
      DB_USER: root
      DB_PASSWORD: ci_root
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      SECRET_KEY: clave-solo-para-las-pruebas-de-ci
      DEBUG: "False"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # mysqlclient (en requirements.txt) se compila y necesita estas librerías
      - name: Librerías del sistema
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmysqlclient-dev pkg-config

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar la configuración
        run: python manage.py check

      - name: Ninguna migración pendiente por crear
        run: python manage.py makemigrations --check --dry-run

      - name: Aplicar migraciones
        run: python manage.py migrate --noinput

      - name: Tests
        run: python manage.py test --noinput

  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
